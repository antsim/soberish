name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed by configure-pages below to turn Pages on if it is still off.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Reports the site's real base path, which handles custom domains and
      # user/org sites. `enablement: true` also tries to create the Pages site
      # on a first run, but the workflow token is not always allowed to —
      # creating a site needs admin rights the GITHUB_TOKEN may not have, and
      # orgs can block it outright. That is a reason to fall back to the
      # project-site convention below, not to fail the build: let the deploy
      # job report the real problem.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - run: npm ci

      - run: npm test

      - name: Build
        env:
          # Optional. Without them Soberish still builds and runs, just
          # offline-only: no accounts, no sync, no leaderboard.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Project pages live under /<repo>/; a user, org, or custom-domain
          # site is served from the root. configure-pages knows which — and
          # when it could not ask, the repository name is the right guess.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          fallback="/$REPO_NAME"
          case "$REPO_NAME" in *.github.io) fallback="/" ;; esac
          base="${PAGES_BASE_PATH:-$fallback}"
          base="/${base#/}"
          BASE_HREF="${base%/}/" npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/soberish/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
