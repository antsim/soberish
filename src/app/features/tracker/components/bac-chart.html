<div
  class="frame"
  #frame
  [class.frame--interactive]="interactive()"
  [attr.tabindex]="interactive() ? 0 : null"
  [attr.aria-label]="
    interactive() ? description() + ' Drag to pan, pinch or scroll to zoom.' : null
  "
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  (wheel)="onWheel($event)"
  (keydown)="onKeyDown($event)"
>
  <svg
    class="chart"
    [attr.viewBox]="'0 0 ' + width() + ' ' + height"
    [attr.width]="width()"
    [attr.height]="height"
    role="img"
    [attr.aria-label]="description()"
  >
    <defs>
      <linearGradient id="bac-area" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.42" />
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
      </linearGradient>
      <filter id="bac-glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <g class="grid">
      @for (line of gridLines(); track line.label) {
        <line
          [attr.x1]="plot().left"
          [attr.x2]="plot().right"
          [attr.y1]="line.y"
          [attr.y2]="line.y"
        />
        <text
          class="axis-label"
          [attr.x]="plot().left - 8"
          [attr.y]="line.y + 3.5"
          text-anchor="end"
        >
          {{ line.label }}
        </text>
      }
    </g>

    <g class="time-axis">
      @for (tick of timeTicks(); track tick.label) {
        <text class="axis-label" [attr.x]="tick.x" [attr.y]="height - 10" text-anchor="middle">
          {{ tick.label }}
        </text>
      }
    </g>

    <path class="area" [attr.d]="paths().area" fill="url(#bac-area)" />
    <path class="line line--future" [attr.d]="paths().future" />
    <path class="line line--past" [attr.d]="paths().past" filter="url(#bac-glow)" />

    <line
      class="now-line"
      [attr.x1]="nowPoint().x"
      [attr.x2]="nowPoint().x"
      [attr.y1]="plot().top"
      [attr.y2]="plot().bottom"
    />
    <circle class="now-halo" [attr.cx]="nowPoint().x" [attr.cy]="nowPoint().y" r="11" />
    <circle class="now-dot" [attr.cx]="nowPoint().x" [attr.cy]="nowPoint().y" r="5" />

    <g class="markers">
      @for (marker of markers(); track marker.id) {
        <g [attr.transform]="'translate(' + marker.x + ',' + marker.y + ')'">
          <title>{{ marker.label }}</title>
          <line y1="-6" y2="-1" />
          @if (marker.showIcon) {
            <text class="marker-icon" y="12" text-anchor="middle">{{ marker.icon }}</text>
          }
        </g>
      }
    </g>
  </svg>
</div>
