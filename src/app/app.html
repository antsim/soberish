<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Soberish home">
    <img class="brand__mark" src="icons/icon-96.png" alt="" width="32" height="32" />
    <span class="brand__name">Soberish</span>
  </a>

  <div class="topbar__end">
    @if (!network.online()) {
      <span class="pill pill--offline" title="Offline — everything still works">Offline</span>
    } @else if (sync.state() === 'syncing') {
      <span class="pill">Syncing</span>
    }
    @if (pwa.canInstall() && !pwa.installed()) {
      <button type="button" class="pill pill--install" (click)="install()">Install</button>
    }
  </div>
</header>

<main id="main" class="main">
  <router-outlet />
</main>

<nav class="tabbar" aria-label="Primary">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
    <span class="tabbar__icon" aria-hidden="true">🍺</span>
    <span class="tabbar__label">Tonight</span>
  </a>
  <a routerLink="/leaderboard" routerLinkActive="active">
    <span class="tabbar__icon" aria-hidden="true">🏆</span>
    <span class="tabbar__label">Top BAC</span>
  </a>
  <a routerLink="/you" routerLinkActive="active">
    <span class="tabbar__icon" aria-hidden="true">⚙️</span>
    <span class="tabbar__label">You</span>
  </a>
</nav>

<app-toast-host />
